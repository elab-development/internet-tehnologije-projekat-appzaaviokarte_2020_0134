<div class="dialog">
  <div class="dialog-header">
    <h1 mat-dialog-title>Create New Airport</h1>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content>
    <form [formGroup]="airportForm" class="dialog-form">
      <div class="form-row">
        <mat-form-field appearance="fill" class="input-field">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error *ngIf="airportForm.get('name')?.hasError('required')">
            Name is required.
          </mat-error>
          <mat-error *ngIf="airportForm.get('name')?.hasError('nameExists')">
            Airport name already exists.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="input-field">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" />
          <mat-error *ngIf="airportForm.get('city')?.hasError('required')">
            City is required.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="fill" class="input-field">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" />
          <mat-error *ngIf="airportForm.get('country')?.hasError('required')">
            Country is required.
          </mat-error>
        </mat-form-field>
      </div>
    </form>
  </div>
  <div mat-dialog-actions>
    <button mat-button class="cancel-btn" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSubmit()">
      Create
    </button>
  </div>
</div>
