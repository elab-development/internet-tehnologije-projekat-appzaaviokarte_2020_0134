<div class="page">
  <section class="section" id="bodyContainer">
    <div class="section__title-1">
      <h2 class="section__description">Discover flights</h2>
      <h3 class="section__header">
        with <i class="fa-solid fa-at"></i>Flightly
      </h3>
    </div>
    <div class="columns">
      <aside class="column is-one-quarter enter-form">
        <form name="searchFlight" class="box form-container">
          <h2 class="desc">
            Find destinations <i class="fa-solid fa-plane-departure"></i>
          </h2>

          <div class="sourceDestination mb-3">
            <h4 class="fromTitle">
              From <i class="fa-solid fa-location-dot"></i>
            </h4>
            <select
              name="fromAirport"
              class="searchFormField"
              [(ngModel)]="fromAirport"
            >
              <option value="" disabled selected>Select Airport</option>
              <option *ngFor="let airport of airports" [ngValue]="airport">
                {{ airport.name }}, {{ airport.city }}, {{ airport.country }}
              </option>
            </select>
          </div>

          <div class="sourceDestination mb-3">
            <h4 class="toTitle">
              To <i class="fa-solid fa-location-arrow"></i>
            </h4>
            <select
              name="toAirport"
              class="searchFormField"
              [(ngModel)]="toAirport"
            >
              <option value="" disabled selected>Select Airport</option>
              <option *ngFor="let airport of airports" [ngValue]="airport">
                {{ airport.name }}, {{ airport.city }}, {{ airport.country }}
              </option>
            </select>
          </div>

          <div class="field searchFormField">
            <h4 class="fromTitle">
              Select date <i class="fa-regular fa-calendar"></i>
            </h4>
            <div class="control">
              <input
                class="input searchFormField"
                type="date"
                name="travelDate"
                placeholder="Travel Date"
                id="travelDate"
                [(ngModel)]="travelDate"
                [min]="minDate"
              />
            </div>
          </div>

          <div class="field">
            <div class="control">
              <button
                class="button is-success is-rounded"
                type="button "
                (click)="searchFlights()"
              >
                Search flights
              </button>
            </div>
          </div>
        </form>
      </aside>

      <div class="column">
        <div *ngIf="isLoading" class="has-text-centered loading">
          <mat-spinner></mat-spinner>
        </div>

        <div *ngIf="!isLoading && flights.length === 0" class="container-text">
          No flights for applied filters.
        </div>

        <div id="FlightResult" *ngIf="!isLoading && flights.length > 0">
          <div class="box">
            <h2 class="desc">
              Available flights <i class="fa-regular fa-circle-check"></i>
            </h2>
            <div class="row header">
              <div class="cell">Airline</div>
              <div class="cell">Departure</div>
              <div class="cell">Arrival</div>
              <div class="cell">Price</div>
              <div class="cell"></div>
              <div class="cell"></div>
            </div>
          </div>

          <ng-container *ngFor="let flight of flights">
            <div class="box">
              <div class="row">
                <div class="cell">
                  <!-- <figure class="image is-48x48"> -->
                  <!-- <img [src]="flight.airlineLogo" alt="{{flight.airline}}"> -->
                  <!-- </figure> -->
                  <span>{{ flight.airline }}</span>
                </div>
                <div class="cell">{{ flight.departure_date }}</div>
                <div class="cell">{{ flight.arrival_date }}</div>
                <div class="cell">{{ flight.price | currency }}</div>
                <div class="cell">
                  <button
                    class="button is-success is-rounded"
                    (click)="bookFlight(flight.flight_id)"
                  >
                    Book Now
                  </button>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </section>
</div>
